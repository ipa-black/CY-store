name: Beta Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Modify, and Release Beta
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # (التحسين 1) جلب الكود الأخير فقط لسرعة فائقة
          submodules: recursive

      - name: Setup Xcode Cache
        uses: actions/cache@v4
        # (التحسين 2) تخزين الملفات المؤقتة لتسريع عمليات البناء القادمة بشكل هائل
        with:
          path: ~/Library/Developer/Xcode/DerivedData/
          key: ${{ runner.os }}-xcode-deriveddata-${{ hashFiles('**/project.pbxproj', '**/*.Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-deriveddata-

      - name: Use Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true

      - name: Fast Modify & Patch (Info.plist & iOS 15 UI)
        # (التحسين 3) دمج جميع عمليات التعديل والبحث في خطوة واحدة سريعة جداً
        run: |
          # تعديل Info.plist
          INFO_PLIST_PATH="Feather/Resources/Info.plist"
          if [ -f "$INFO_PLIST_PATH" ]; then
            plutil -replace CFBundleDisplayName -string "الرئيسية" "$INFO_PLIST_PATH" || true
            plutil -replace CFBundleName -string "ATTACK STORE" "$INFO_PLIST_PATH" || true
            plutil -replace CFBundleIdentifier -string "app.attackstore" "$INFO_PLIST_PATH" || true
            plutil -replace MinimumOSVersion -string "15.0" "$INFO_PLIST_PATH" || true
          fi

          # إجبار المشروع على iOS 15
          find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9]*\.[0-9]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' {} +

          # بحث وتعديل أكواد واجهة iOS 15 بتمريرة واحدة فقط على الملفات
          find . -name "*.swift" -type f -exec perl -pi -e '
            s/\.rect\(cornerRadius:\s*([^,]+),\s*style:\s*\.([^)]+)\)/RoundedRectangle(cornerRadius: $1, style: .$2)/g;
            s/\.glassEffect\([^,]+,\s*in:/ \.background(Color.secondary.opacity(0.2), in:/g;             s/\.glassEffect\(\)/\.background(Color.secondary.opacity(0.2))/g;
          ' {} +

      - name: Update Version with agvtool
        run: |
          agvtool new-version -all $(git rev-parse HEAD) || true

      - name: Build and Verify
        run: |
          export IPHONEOS_DEPLOYMENT_TARGET=15.0
          make iphoneos
          mkdir -p upload
          find . -name "*.ipa" -exec mv {} upload/ \;

      - name: Get Version & Create Release Directly
        # (التحسين 4) دمج الخطوتين اختصاراً للوقت
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(plutil -extract CFBundleShortVersionString raw "Feather/Resources/Info.plist" 2>/dev/null || echo "1.0.0")
          NEW_TAG="beta-${{ github.run_number }}"
          
          gh release create "$NEW_TAG" "upload/*.ipa" \
            --title "ATTACK STORE v$VERSION" \
            --notes "### ATTACK STORE Auto Build\nCommit: \`${{ github.sha }}\`\n*📱 iOS 15 Compatibility Patched & Build Optimized ⚡*" \
            --prerelease \
            --target ${{ github.sha }}
