name: vsign Auto Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Modify, and Release vsign
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 
          submodules: recursive

      - name: Setup Xcode Cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/
          key: ${{ runner.os }}-xcode-deriveddata-${{ hashFiles('**/project.pbxproj', '**/*.Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-deriveddata-

      - name: Auto-Detect and Use Xcode 16
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | head -n 1)
          if [ -z "$XCODE_PATH" ]; then
            echo "❌ لم يتم العثور على Xcode 16. الإصدارات المتوفرة هي:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "✅ تم العثور على الإصدار وتفعيله: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Fast Modify & Patch (vsign Info, iOS 15 UI & Swift 6 Sendable Fix)
        run: |
          # تعديل الاسم والحزمة إلى vsign
          INFO_PLIST_PATH="Feather/Resources/Info.plist"
          if [ -f "$INFO_PLIST_PATH" ]; then
            plutil -replace CFBundleDisplayName -string "vsign" "$INFO_PLIST_PATH" || true
            plutil -replace CFBundleName -string "vsign" "$INFO_PLIST_PATH" || true
            plutil -replace CFBundleIdentifier -string "app.vsign.store" "$INFO_PLIST_PATH" || true
            plutil -replace MinimumOSVersion -string "15.0" "$INFO_PLIST_PATH" || true
          fi

          # إجبار البناء على iOS 15 وإيقاف التدقيق الصارم على مستوى المشروع
          find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9]*\.[0-9]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0; SWIFT_STRICT_CONCURRENCY = minimal;/g' {} +

          # 💡 الحل الجذري هنا: تعديل أكواد الواجهات، وإضافة @Sendable إجبارياً للـ completion لحل خطأ Swift 6
          find . -name "*.swift" -type f -exec perl -pi -e '
            s/\.rect\(cornerRadius:\s*([^,]+),\s*style:\s*\.([^)]+)\)/RoundedRectangle(cornerRadius: $1, style: .$2)/g;
            s/\.glassEffect\([^,]+,\s*in:/ \.background(Color.secondary.opacity(0.2), in:/g;             s/\.glassEffect\(\)/\.background(Color.secondary.opacity(0.2))/g;
            s/\@escaping\s*\(/ \@escaping \@Sendable \(/g;
          ' {} +

      - name: Update Version with agvtool
        run: |
          agvtool new-version -all $(git rev-parse HEAD) || true

      - name: Build vsign IPA
        run: |
          export IPHONEOS_DEPLOYMENT_TARGET=15.0
          
          # تمرير اسم vsign لملف Makefile ليكون الناتج vsign.ipa
          make iphoneos NAME=vsign
          
          mkdir -p upload
          find packages -name "*.ipa" -exec mv {} upload/ \;

      - name: Get Version & Create Release Directly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(plutil -extract CFBundleShortVersionString raw "Feather/Resources/Info.plist" 2>/dev/null || echo "1.0.0")
          NEW_TAG="vsign-${{ github.run_number }}"
          
          gh release create "$NEW_TAG" "upload/*.ipa" \
            --title "vsign v$VERSION" \
            --notes "### vsign Auto Build 🚀\nCommit: \`${{ github.sha }}\`\n*📱 Compiled with Xcode 16 & Swift 6 Sendable Concurrency Fixed ⚡*" \
            --prerelease \
            --target ${{ github.sha }}
