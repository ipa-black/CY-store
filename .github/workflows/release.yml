name: Beta Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Modify, and Release Beta
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Modify App Info (Name and Bundle ID)
        run: |
          INFO_PLIST_PATH="Feather/Resources/Info.plist"
          if [ ! -f "$INFO_PLIST_PATH" ]; then
            echo "Error: Info.plist not found."
            exit 1
          fi

          echo "Modifying Info.plist..."
          plutil -replace CFBundleDisplayName -string "الرئيسية" "$INFO_PLIST_PATH" || true
          plutil -replace CFBundleName -string "ATTACK STORE" "$INFO_PLIST_PATH" || true
          plutil -replace CFBundleIdentifier -string "app.attackstore" "$INFO_PLIST_PATH" || true

      - name: Set iOS 15 Deployment Target
        run: |
          INFO_PLIST_PATH="Feather/Resources/Info.plist"
          plutil -replace MinimumOSVersion -string "15.0" "$INFO_PLIST_PATH" || true
          find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9]*\.[0-9]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' {} +

      - name: Update Version with agvtool
        run: |
          agvtool new-version -all $(git rev-parse HEAD) || true

      - name: Build and Verify
        run: |
          export IPHONEOS_DEPLOYMENT_TARGET=15.0
          make iphoneos
          mkdir -p upload
          find . -name "*.ipa" -exec mv {} upload/ \;
          test -n "$(find upload -name "*.ipa" -print -quit)"

      - name: Get Version from Info.plist
        id: get_version
        run: |
          INFO_PLIST_PATH="Feather/Resources/Info.plist"
          VERSION=$(plutil -extract CFBundleShortVersionString raw "$INFO_PLIST_PATH" 2>/dev/null || echo "1.0.0")
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create GitHub Release Directly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="beta-${{ github.run_number }}"
          gh release create "$NEW_TAG" "upload/*.ipa" \
            --title "ATTACK STORE v${{ env.VERSION }}" \
            --notes "### ATTACK STORE Auto Build\nCommit: \`${{ github.sha }}\`" \
            --prerelease \
            --target ${{ github.sha }}
