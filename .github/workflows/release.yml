name: Release CY STORE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          # 🔥 زيادة عمق الجلب للسماح للأكشن بالبحث في السجل عن نسخة سليمة
          fetch-depth: 20 

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: 🛠️ Auto-Repair Corrupted Project (Self-Healing)
        run: |
          echo "🔍 جاري فحص سلامة ملف Feather.xcodeproj..."
          
          MAX_RETRIES=10
          ATTEMPT=0
          
          # حلقة اختبار: إذا فشل Xcode في قراءة الملف، يقوم الأكشن باسترجاع نسخة أقدم للمشروع تدريجياً
          while ! xcodebuild -list -project Feather.xcodeproj > /dev/null 2>&1; do
            ATTEMPT=$((ATTEMPT+1))
            if [ $ATTEMPT -ge $MAX_RETRIES ]; then
              echo "❌ فشل الإصلاح التلقائي بعد $MAX_RETRIES محاولات. يرجى إصلاح الملف يدوياً."
              exit 1
            fi
            
            echo "⚠️ تم اكتشاف تلف (مثل خطأ isa). جاري استرجاع النسخة السليمة رقم $ATTEMPT..."
            # استرجاع ملف المشروع فقط من التزام (Commit) أقدم، مع ترك باقي أكواد التطبيق كما هي
            git checkout HEAD~$ATTEMPT -- Feather.xcodeproj/project.pbxproj || true
          done
          
          echo "✅ ملف المشروع سليم وجاهز للبناء!"

      - name: Compile CY STORE
        run: | 
          # 1. إرجاع إصدار الماك إلى 13 المدعوم
          find . -name "Package.swift" -exec sed -i '' 's/\.macOS(\.v15)/\.macOS(\.v13)/g' {} + || true
          find . -name "Package.swift" -exec sed -i '' 's/\.macOS(\.v16)/\.macOS(\.v13)/g' {} + || true
          find . -name "Package.swift" -exec sed -i '' 's/\.macOS(\.v14)/\.macOS(\.v13)/g' {} + || true
          
          # 2. تغيير إصدارات الآيفون والتلفاز فقط إلى 15 بشكل آمن
          find . -name "Package.swift" -exec sed -i '' 's/\.iOS(\.v1[0-9])/\.iOS(\.v15)/g' {} + || true
          find . -name "Package.swift" -exec sed -i '' 's/\.tvOS(\.v1[0-9])/\.tvOS(\.v15)/g' {} + || true

          # 3. الإصلاحات التلقائية لأكواد Swift
          find . -name "*.swift" -exec sed -i '' 's/URL\.documentsDirectory/FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first!/g' {} + || true
          find . -name "*.swift" -exec sed -i '' 's/\.scrollDismissesKeyboard(\.interactively)//g' {} + || true
          find . -name "*.swift" -exec sed -i '' 's/\.contentTransition(\.numericText())//g' {} + || true
          find . -name "*.swift" -exec sed -i '' 's/Image(systemName: "checkmark")\.bold()/Image(systemName: "checkmark").font(.body.weight(.bold))/g' {} + || true
          
          # رقم بناء ثابت
          xcrun agvtool new-version -all "100" || true
          
          make
          mkdir upload
          mv packages/* upload/

      - name: Determine Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            DATE_STR=$(date +'%Y.%m.%d')
            echo "VERSION=v${DATE_STR}" >> $GITHUB_ENV
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: CY STORE ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            upload/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
